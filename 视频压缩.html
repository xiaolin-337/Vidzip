<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>视频压缩工具</title>
  <style>
    :root{
      --bg1:#0b1020;--bg2:#211b45;--panel:rgba(17,24,39,.86);--line:rgba(255,255,255,.12);
      --text:#f4f5fb;--muted:#9aa4ba;--violet:#a78bfa;--blue:#60a5fa;--green:#34d399;
      --yellow:#fbbf24;--red:#fb7185
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);min-height:100vh;padding:24px;background:radial-gradient(circle at 20% 0,#262158 0,transparent 40%),linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;justify-content:center;align-items:flex-start}
    button,input,select{font:inherit}
    .container{width:min(780px,100%);padding:32px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 28px 90px rgba(0,0,0,.5);backdrop-filter:blur(18px)}
    h1{text-align:center;font-size:1.75rem;background:linear-gradient(90deg,var(--violet),var(--blue));background-clip:text;-webkit-background-clip:text;color:transparent}

    /* 上传区：选中文件后原地变为视频预览 */
    .drop-zone{position:relative;margin-top:22px;min-height:170px;border:2px dashed rgba(167,139,250,.45);border-radius:17px;background:rgba(167,139,250,.05);transition:.2s ease;cursor:pointer;overflow:hidden}
    .drop-zone:not(.active){display:flex;flex-direction:column;justify-content:center;text-align:center;padding:34px 22px}
    .drop-zone:hover:not(.active),.drop-zone.drag-over{border-color:var(--violet);background:rgba(167,139,250,.11)}
    .drop-zone input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
    .drop-zone.active{border-style:solid;border-color:var(--line);background:#000;cursor:default}
    .drop-zone.active input{display:none}
    .drop-zone.active .drop-content{display:none}
    .drop-icon{font-size:2.7rem}.drop-text{margin-top:10px;color:#cbd2e2}.drop-text strong{color:#c4b5fd}.drop-help{font-size:.74rem;color:#778198;margin-top:8px}
    .preview-content video{display:block;width:100%;max-height:340px;background:#000}
    .preview-meta{display:flex;flex-direction:column;gap:4px;padding:11px 14px;background:rgba(255,255,255,.04);font-size:.79rem;color:var(--muted)}
    .preview-meta b{color:#e6e9f2;font-weight:600;overflow-wrap:anywhere}
    .btn-change{position:absolute;top:10px;right:10px;padding:8px 15px;border:0;border-radius:999px;background:rgba(10,12,24,.75);color:#e6e9f2;font-size:.75rem;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
    .btn-change:hover{background:rgba(10,12,24,.95)}

    .notice{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.08);color:#f9d879;font-size:.78rem;line-height:1.6}.notice.show{display:block}.notice.error{border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08);color:#fda4af}

    .controls{display:none;margin-top:22px;gap:16px;flex-direction:column}.controls.show{display:flex}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field label{display:block;color:#c8cede;font-size:.8rem;margin-bottom:7px}
    select{width:100%;padding:11px 12px;color:#f8fafc;background:#20263a;border:1px solid var(--line);border-radius:11px;outline:none}select:focus{border-color:var(--violet)}option{background:#20263a}
    .segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .seg{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);color:#c8cede;font-weight:700;cursor:pointer;transition:.15s}
    .seg small{font-size:.68rem;font-weight:400;color:#8b94a9}
    .seg:hover{border-color:rgba(167,139,250,.55)}
    .seg.selected{border-color:transparent;background:linear-gradient(135deg,#8b5cf6,#3b82f6);color:#fff}
    .seg.selected small{color:#dfe3f2}
    .range-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.range-head label{font-size:.8rem;color:#c8cede}.range-value{padding:3px 8px;border-radius:7px;background:rgba(167,139,250,.16);color:#c4b5fd;font-weight:700;font-size:.76rem}
    input[type=range]{appearance:none;width:100%;height:6px;border-radius:6px;background:rgba(255,255,255,.12);outline:none}input[type=range]::-webkit-slider-thumb{appearance:none;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:0 0 10px rgba(167,139,250,.5);cursor:pointer}
    .buttons{display:grid;grid-template-columns:1fr auto;gap:10px}.btn{border:0;border-radius:12px;padding:13px 18px;color:white;font-weight:700;cursor:pointer;transition:.18s ease}.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}.btn:disabled{opacity:.42;cursor:not-allowed}.primary{background:linear-gradient(135deg,#8b5cf6,#3b82f6)}.cancel{display:none;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fda4af}.cancel.show{display:block}
    .progress{display:none;margin-top:18px}.progress.show{display:block}.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}.fill{width:0;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue),var(--green));border-radius:inherit;transition:width .18s}.progress-text{text-align:center;min-height:22px;margin-top:8px;color:var(--muted);font-size:.79rem}.progress-text.error{color:#fda4af}.progress-text.success{color:#86efac}
    .result{display:none;margin-top:20px;padding:19px;border-radius:16px;border:1px solid rgba(52,211,153,.27);background:rgba(52,211,153,.055)}.result.show{display:block}.verified{text-align:center;color:#86efac;font-size:.78rem;margin-bottom:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:11px;border-radius:11px;background:rgba(255,255,255,.045);text-align:center}.stat strong{display:block;color:#c4b5fd;font-size:1.12rem}.stat span{font-size:.7rem;color:var(--muted)}.download{width:100%;margin-top:14px;background:linear-gradient(135deg,#10b981,#059669)}.reset{width:100%;margin-top:9px;background:transparent;border:1px solid var(--line);color:#aab3c5}
    @media(max-width:620px){body{padding:12px}.container{padding:22px 16px;border-radius:18px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.buttons{grid-template-columns:1fr}.cancel.show{display:block}}
  </style>
</head>
<body>
<main class="container">
  <h1>🎬 视频压缩工具</h1>

  <section class="drop-zone" id="dropZone">
    <input id="fileInput" type="file" accept="video/*,.mov,.mp4,.m4v,.avi,.mkv,.webm,.mts,.m2ts,.3gp,.flv,.wmv">
    <div class="drop-content">
      <div class="drop-icon">📁</div>
      <div class="drop-text">拖拽视频到这里，或 <strong>点击选择</strong></div>
      <div class="drop-help">支持 MP4、MOV 等常见格式，单个文件 2 GB 以内</div>
    </div>
    <div class="preview-content" id="previewContent" hidden>
      <video id="previewVideo" controls playsinline></video>
      <div class="preview-meta">
        <b id="metaName">-</b>
        <span id="metaInfo">分析中…</span>
        <span id="metaNote" hidden></span>
      </div>
    </div>
    <button class="btn-change" id="btnChange" type="button" hidden>更换视频</button>
  </section>

  <div class="notice" id="notice"></div>

  <section class="controls" id="controls">
    <div class="grid">
      <div class="field">
        <label for="fpsSelect">帧率</label>
        <select id="fpsSelect">
          <option value="0" selected>自动（与原视频一致）</option>
          <option value="60">60</option>
          <option value="30">30</option>
          <option value="25">25</option>
          <option value="24">24</option>
          <option value="15">15</option>
        </select>
      </div>
      <div class="field">
        <label for="formatSelect">输出格式</label>
        <select id="formatSelect">
          <option value="mp4" selected>MP4</option>
          <option value="mov">MOV</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>压缩幅度</label>
      <div class="segmented" id="ratioGroup">
        <button type="button" class="seg" data-ratio="0.75">轻度压缩<small>约缩小 25%</small></button>
        <button type="button" class="seg selected" data-ratio="0.5">中度压缩<small>约缩小 50%</small></button>
        <button type="button" class="seg" data-ratio="0.25">大幅压缩<small>约缩小 75%</small></button>
      </div>
    </div>

    <div>
      <div class="range-head"><label for="scaleRange">画面尺寸</label><span class="range-value" id="scaleVal">100%</span></div>
      <input id="scaleRange" type="range" min="0.25" max="1" step="0.05" value="1">
    </div>

    <div class="buttons">
      <button class="btn primary" id="btnCompress" disabled>⚡ 开始压缩</button>
      <button class="btn cancel" id="btnCancel">停止</button>
    </div>
  </section>

  <section class="progress" id="progressWrap">
    <div class="bar"><div class="fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </section>

  <section class="result" id="resultBox">
    <div class="verified" id="verifiedText">✓ 压缩完成</div>
    <div class="stats">
      <div class="stat"><strong id="resBefore">-</strong><span>压缩前</span></div>
      <div class="stat"><strong id="resAfter">-</strong><span>压缩后</span></div>
      <div class="stat"><strong id="resSaved">-</strong><span>体积变化</span></div>
    </div>
    <button class="btn download" id="btnDownload">⬇ 下载视频</button>
    <button class="btn reset" id="btnReset">↩ 压缩另一个视频</button>
  </section>
</main>

<script type="module">
'use strict';

const $ = id => document.getElementById(id);
const WASM_LIMIT = 2 * 1024 * 1024 * 1024;
const ENGINE_TIMEOUT = 120000;
const PROBE_TIMEOUT = 90000;

let originalFile = null;
let sourceInfo = null;
let outputBlob = null;
let outputName = '';
let previewURL = '';
let downloadURL = '';
let ffmpeg = null;
let FFmpegClass = null;
let FFFSType = null;
let inputPath = '';
let sourceMounted = false;
let mountedFile = null;
let running = false;
let analyzing = false;
let cancelRequested = false;
let operationToken = 0;
let phase = 'idle';
let logs = [];

function setProgress(percent, text, kind = '') {
  const pct = Math.max(0, Math.min(100, Number.isFinite(percent) ? percent : 0));
  $('progressWrap').classList.add('show');
  $('progressFill').style.width = `${pct}%`;
  $('progressText').textContent = text;
  $('progressText').className = `progress-text ${kind}`.trim();
}

function hideProgress() {
  $('progressWrap').classList.remove('show');
  $('progressFill').style.width = '0%';
  $('progressText').textContent = '';
}

function showNotice(message, isError = false) {
  $('notice').textContent = message;
  $('notice').className = `notice show${isError ? ' error' : ''}`;
}

function hideNotice() {
  $('notice').className = 'notice';
  $('notice').textContent = '';
}

function clearOutput() {
  outputBlob = null;
  outputName = '';
  if (downloadURL) {
    URL.revokeObjectURL(downloadURL);
    downloadURL = '';
  }
}

function fmtBytes(bytes) {
  if (!Number.isFinite(bytes)) return '-';
  const units = ['B', 'KB', 'MB', 'GB'];
  let value = bytes;
  let unit = 0;
  while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
  return `${value.toFixed(unit === 0 ? 0 : 2)} ${units[unit]}`;
}

function fmtTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return '未知时长';
  const s = Math.round(seconds);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

function parseRate(rate) {
  if (!rate || rate === '0/0' || rate === '0:1') return 0;
  const parts = String(rate).split(/[:/]/).map(Number);
  if (parts.length < 2 || !parts[1]) return parts[0] || 0;
  return parts[0] / parts[1];
}

function withTimeout(promise, ms, message) {
  let timer;
  return Promise.race([
    promise,
    new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); })
  ]).finally(() => clearTimeout(timer));
}

function safeMessage(error) {
  const raw = String(error?.message || error || '未知错误');
  const tail = logs.slice(-8).join(' ');
  const all = `${raw} ${tail}`.toLowerCase();
  if (cancelRequested || all.includes('called ffmpeg.terminate')) return '操作已停止';
  if (all.includes('out of memory') || all.includes('memory access out of bounds') || all.includes('oom')) return '内存不足，请关闭其他标签页或选择更小的画面尺寸后重试。';
  if (all.includes('invalid data') || all.includes('moov atom not found')) return '视频文件已损坏或无法识别。';
  if (all.includes('encrypted') || all.includes('drm')) return '该视频受保护，无法压缩。';
  if (all.includes('timeout')) return '处理超时，请重试。';
  if (all.includes('failed to fetch') || all.includes('import') || all.includes('worker')) return '处理引擎加载失败，请刷新页面重试。';
  // 程序内部抛出的中文提示对使用者有意义，直接展示；
  // 其余（引擎原始输出）仅记录在控制台供排查，界面显示通用提示。
  if (/[\u4e00-\u9fff]/.test(raw)) return raw;
  console.error('[视频压缩工具]', error, logs.join('\n'));
  return '压缩失败，请重试；若持续失败，请更换视频文件。';
}

function resetEngine() {
  if (ffmpeg) {
    try { ffmpeg.terminate(); } catch (_) {}
  }
  ffmpeg = null;
  sourceMounted = false;
  mountedFile = null;
  inputPath = '';
  phase = 'idle';
  logs = [];
}

async function ensureEngine() {
  if (location.protocol === 'file:') {
    throw new Error('请通过「启动视频压缩工具」或网站打开本工具，不要直接双击网页文件。');
  }
  if (ffmpeg?.loaded) return;

  setProgress(3, '正在加载处理引擎，首次可能需要稍等…');
  phase = 'loading';
  if (!FFmpegClass) {
    const module = await import('./ffmpeg/ffmpeg.js');
    FFmpegClass = module.FFmpeg;
    FFFSType = module.FFFSType;
  }

  ffmpeg = new FFmpegClass();
  ffmpeg.on('log', ({ message }) => {
    if (!message) return;
    logs.push(message);
    if (logs.length > 80) logs.shift();
  });
  ffmpeg.on('progress', ({ progress, time }) => {
    if (phase !== 'transcoding' || !running) return;
    const ratio = Math.max(0, Math.min(1, Number(progress) || 0));
    const pct = 12 + Math.round(ratio * 78);
    const at = Number(time) > 0 ? ` · 已处理 ${fmtTime(Number(time) / 1_000_000)}` : '';
    setProgress(pct, `正在压缩… ${Math.round(ratio * 100)}%${at}`);
  });

  const base = new URL('./ffmpeg/', location.href);
  // 引擎核心从官方 CDN 加载（与本地 ffmpeg 库同版本），
  // 仓库无需携带 31MB 的引擎文件，方便网页版上传。
  const coreBase = 'https://unpkg.com/@ffmpeg/core@0.12.10/dist/esm';
  try {
    await withTimeout(ffmpeg.load({
      classWorkerURL: new URL('worker.js', base).href,
      coreURL: `${coreBase}/ffmpeg-core.js`,
      wasmURL: `${coreBase}/ffmpeg-core.wasm`
    }), ENGINE_TIMEOUT, '处理引擎加载 timeout');
  } catch (error) {
    resetEngine();
    throw error;
  }
  phase = 'idle';
}

// 引擎常驻复用：换文件时仅重新挂载，不销毁引擎，第二次压缩无需重新加载。
async function mountSource() {
  await ensureEngine();
  if (sourceMounted && mountedFile === originalFile) return;
  if (sourceMounted) {
    try { await ffmpeg.unmount('/source'); } catch (_) {}
    sourceMounted = false;
    mountedFile = null;
  }
  try { await ffmpeg.createDir('/source'); } catch (_) {}
  await ffmpeg.mount(FFFSType.WORKERFS, { files: [originalFile] }, '/source');
  sourceMounted = true;
  mountedFile = originalFile;
  inputPath = `/source/${originalFile.name}`;
}

async function removeVirtualFile(path) {
  if (!ffmpeg || !path) return;
  try { await ffmpeg.deleteFile(path); } catch (_) {}
}

async function probeFile(path, label = 'probe') {
  const jsonPath = `/${label}_${Date.now()}_${Math.random().toString(36).slice(2)}.json`;
  let engineTimedOut = false;
  try {
    let code;
    try {
      code = await withTimeout(ffmpeg.ffprobe([
        '-v', 'error',
        '-show_format',
        '-show_streams',
        '-print_format', 'json',
        path,
        '-o', jsonPath
      ], PROBE_TIMEOUT), PROBE_TIMEOUT + 5000, '视频分析 timeout');
    } catch (error) {
      if (String(error?.message || error).includes('timeout')) {
        engineTimedOut = true;
        resetEngine();
      }
      throw error;
    }
    if (code === 1) {
      engineTimedOut = true;
      resetEngine();
      throw new Error('视频分析 timeout');
    }
    // core 0.12.10 在部分浏览器中即使已成功写出 JSON，仍会报告 -1，
    // 因此以实际输出是否存在且可解析为准。
    let text;
    try {
      text = await ffmpeg.readFile(jsonPath, 'utf8');
    } catch (error) {
      throw new Error('无法读取视频信息，请重试。', { cause: error });
    }
    if (!String(text).trim()) throw new Error('无法读取视频信息，请重试。');
    try {
      return JSON.parse(text);
    } catch (error) {
      throw new Error('无法读取视频信息，请重试。', { cause: error });
    }
  } finally {
    if (!engineTimedOut) await removeVirtualFile(jsonPath);
  }
}

function chooseStreams(probe) {
  const streams = Array.isArray(probe?.streams) ? probe.streams : [];
  const videos = streams.filter(s => s.codec_type === 'video' && Number(s.disposition?.attached_pic || 0) !== 1);
  videos.sort((a, b) => Number(b.disposition?.default || 0) - Number(a.disposition?.default || 0) || (Number(b.width || 0) * Number(b.height || 0)) - (Number(a.width || 0) * Number(a.height || 0)));
  const audios = streams.filter(s => s.codec_type === 'audio');
  audios.sort((a, b) => Number(b.disposition?.default || 0) - Number(a.disposition?.default || 0));
  if (!videos.length) throw new Error('文件中没有视频画面，请选择视频文件。');
  const video = videos[0];
  const audio = audios[0] || null;
  const duration = Number(probe?.format?.duration || video.duration || audio?.duration || 0);
  const fps = parseRate(video.avg_frame_rate) || parseRate(video.r_frame_rate);
  const transfer = String(video.color_transfer || '').toLowerCase();
  return {
    probe,
    video,
    audio,
    duration,
    fps,
    isHDR: transfer === 'smpte2084' || transfer === 'arib-std-b67'
  };
}

function renderSourceInfo(info) {
  const v = info.video;
  const parts = [fmtBytes(originalFile.size), fmtTime(info.duration), `${v.width || '?'} × ${v.height || '?'}`];
  if (info.fps) parts.push(`${info.fps.toFixed(info.fps % 1 ? 2 : 0)} 帧/秒`);
  parts.push(info.audio ? '有声音' : '无声音');
  $('metaInfo').textContent = parts.join(' · ');
}

function activateZone(file) {
  if (previewURL) URL.revokeObjectURL(previewURL);
  previewURL = URL.createObjectURL(file);
  const video = $('previewVideo');
  video.src = previewURL;
  video.load();
  $('dropZone').classList.add('active');
  $('previewContent').hidden = false;
  $('btnChange').hidden = false;
  $('metaName').textContent = file.name;
  $('metaInfo').textContent = '分析中…';
  $('metaNote').hidden = true;
  video.addEventListener('loadedmetadata', () => { $('metaNote').hidden = true; }, { once: true });
  video.addEventListener('error', () => {
    $('metaNote').hidden = false;
    $('metaNote').textContent = '该视频暂时无法预览，不影响压缩。';
  }, { once: true });
}

function resetZone() {
  $('dropZone').classList.remove('active');
  $('previewContent').hidden = true;
  $('btnChange').hidden = true;
  const video = $('previewVideo');
  video.removeAttribute('src');
  video.load();
  if (previewURL) { URL.revokeObjectURL(previewURL); previewURL = ''; }
}

async function selectFile(file) {
  if (!file) return;
  if (running || analyzing) {
    showNotice('当前任务仍在处理中。请先停止压缩或等待分析完成，再选择新文件。');
    $('fileInput').value = '';
    return;
  }
  analyzing = true;
  operationToken++;
  const token = operationToken;
  cancelRequested = false;
  running = false;
  originalFile = file;
  sourceInfo = null;
  clearOutput();
  $('resultBox').classList.remove('show');
  $('controls').classList.add('show');
  $('btnCompress').disabled = true;
  hideNotice();
  activateZone(file);

  if (file.size >= WASM_LIMIT) {
    setProgress(0, '文件超过 2 GB，无法处理。', 'error');
    showNotice('文件超过 2 GB，暂不支持压缩。', true);
    $('metaInfo').textContent = fmtBytes(file.size);
    analyzing = false;
    return;
  }
  if (file.size > 750 * 1024 * 1024) {
    showNotice('视频较大，处理可能需要较长时间，请保持页面开启。');
  }

  try {
    setProgress(1, '正在读取视频信息…');
    await mountSource();
    if (token !== operationToken) return;
    setProgress(7, '正在分析视频…');
    const probe = await probeFile(inputPath, 'source');
    if (token !== operationToken) return;
    sourceInfo = chooseStreams(probe);
    if (!(sourceInfo.duration > 0)) throw new Error('无法读取该视频的时长，请更换文件。');
    renderSourceInfo(sourceInfo);
    if (sourceInfo.isHDR) {
      showNotice('检测到 HDR 视频，压缩后色彩可能有轻微变化。');
    }
    setProgress(10, '分析完成，可以开始压缩。', 'success');
    $('btnCompress').disabled = false;
  } catch (error) {
    if (token !== operationToken) return;
    const message = safeMessage(error);
    setProgress(0, `❌ ${message}`, 'error');
    showNotice(message, true);
    $('metaInfo').textContent = '分析失败';
    $('btnCompress').disabled = true;
    resetEngine();
  } finally {
    if (token === operationToken) analyzing = false;
  }
}

// 滤镜链：时间戳归零（防止首帧时间偏移导致补帧/丢帧），
// 等比缩放保留画面比例，仅在用户明确选择帧率时才做帧率转换。
function buildFilters(scale, fps, useHDR) {
  const filters = ['setpts=PTS-STARTPTS'];
  if (useHDR) {
    filters.push('zscale=t=linear:npl=100', 'format=gbrpf32le', 'tonemap=tonemap=hable:desat=0', 'zscale=p=bt709:t=bt709:m=bt709:r=tv');
  }
  filters.push(`scale=trunc(iw*${scale}/2)*2:trunc(ih*${scale}/2)*2:flags=lanczos`);
  if (fps > 0) filters.push(`fps=${fps}`);
  filters.push('format=yuv420p');
  return filters.join(',');
}

// 以源文件中音视频数据的实际码率为基准估算体积（排除容器冗余的影响），
// 使“约缩小 N%”的承诺更贴近真实输出；音频约占 15%（限制在 48–160k），
// 其余全部分配给视频，在体积目标内尽量保留画质。
function computeBitrates(ratio) {
  const format = sourceInfo.probe?.format || {};
  const bitRate = Number(format.bit_rate || 0);
  const basis = bitRate > 0 && sourceInfo.duration > 0 ? bitRate * sourceInfo.duration / 8 : originalFile.size;
  const totalKbps = Math.max(1, Math.round(basis * ratio * 8 / sourceInfo.duration / 1000));
  const audioKbps = sourceInfo.audio ? Math.min(160, Math.max(48, Math.round(totalKbps * 0.15))) : 0;
  return { videoKbps: Math.max(50, totalKbps - audioKbps), audioKbps };
}

function buildArgs(outputPath, options, robust = false) {
  const { format, ratio, scale, fps } = options;
  const { videoKbps, audioKbps } = computeBitrates(ratio);
  const args = ['-hide_banner'];
  // 正常路径使用干净参数，保证时间戳与帧数原样保留；
  // 仅在重试时启用容错参数处理特殊或轻微损坏的源文件。
  if (robust) args.push('-fflags', '+genpts+discardcorrupt', '-err_detect', 'ignore_err');
  args.push('-i', inputPath, '-map', `0:${sourceInfo.video.index}`);
  if (sourceInfo.audio) args.push('-map', `0:${sourceInfo.audio.index}`);
  args.push(
    '-map_metadata', '0',
    '-map_chapters', '-1',
    '-vf', buildFilters(scale, fps, sourceInfo.isHDR),
    '-c:v', 'libx264',
    '-preset', robust ? 'veryfast' : 'fast',
    '-b:v', `${videoKbps}k`,
    '-pix_fmt', 'yuv420p',
    '-tag:v', 'avc1'
  );
  if (sourceInfo.audio) {
    args.push('-c:a', 'aac', '-b:a', `${audioKbps}k`);
    if (robust) args.push('-ac', '2');
    args.push('-af', 'aresample=async=1:first_pts=0');
  }
  args.push(
    '-sn', '-dn',
    '-max_muxing_queue_size', '4096',
    '-avoid_negative_ts', 'make_zero',
    '-movflags', '+faststart',
    '-f', format === 'mov' ? 'mov' : 'mp4',
    outputPath
  );
  return args;
}

// 质检：除编码与时长外，还校验帧率、帧数与画面比例，
// 防止出现“凭空多帧、帧率被改、画面拉伸变形”等问题文件。
async function validateOutput(path, options) {
  setProgress(92, '正在检查压缩结果…');
  phase = 'verifying';
  const probe = await probeFile(path, 'output');
  const streams = probe.streams || [];
  const video = streams.find(s => s.codec_type === 'video' && Number(s.disposition?.attached_pic || 0) !== 1);
  const audio = streams.find(s => s.codec_type === 'audio');
  const container = String(probe.format?.format_name || '');
  const majorBrand = String(probe.format?.tags?.major_brand || probe.format?.tags?.MAJOR_BRAND || '').trim().toLowerCase();
  const bad = detail => {
    console.error('[视频压缩工具] 质检未通过：', detail);
    throw new Error('压缩结果异常，请重试。');
  };
  if (!video || video.codec_name !== 'h264') bad({ reason: 'video codec', video });
  if (video.pix_fmt !== 'yuv420p') bad({ reason: 'pix_fmt', actual: video.pix_fmt });
  if (video.codec_tag_string && video.codec_tag_string !== 'avc1') bad({ reason: 'codec tag', actual: video.codec_tag_string });
  if (!container.split(',').some(name => ['mov', 'mp4', 'm4a', '3gp', '3g2', 'mj2'].includes(name))) bad({ reason: 'container', container });
  if (options.format === 'mov' && majorBrand !== 'qt') bad({ reason: 'major brand', majorBrand });
  if (options.format === 'mp4' && majorBrand === 'qt') bad({ reason: 'major brand', majorBrand });
  if (sourceInfo.audio && (!audio || audio.codec_name !== 'aac')) bad({ reason: 'audio missing' });

  const duration = Number(probe.format?.duration || video.duration || 0);
  if (!(duration > 0)) bad({ reason: 'duration', duration });
  const durationTolerance = Math.max(1, Math.min(5, sourceInfo.duration * 0.002));
  if (sourceInfo.duration > 0 && Math.abs(duration - sourceInfo.duration) > durationTolerance) {
    bad({ reason: 'duration mismatch', source: sourceInfo.duration, output: duration });
  }

  // 帧率校验：自动模式必须与源一致；指定帧率时必须等于所选值。
  const outFps = parseRate(video.avg_frame_rate) || parseRate(video.r_frame_rate);
  const fpsTarget = options.fps > 0 ? options.fps : sourceInfo.fps;
  if (fpsTarget > 0 && outFps > 0 && Math.abs(outFps - fpsTarget) > Math.max(0.5, fpsTarget * 0.02)) {
    bad({ reason: 'frame rate', target: fpsTarget, actual: outFps });
  }

  // 帧数校验：自动模式下输出帧数应与源一致（杜绝凭空多帧/丢帧）。
  const srcFrames = Number(sourceInfo.video.nb_frames || 0);
  const outFrames = Number(video.nb_frames || 0);
  if (srcFrames > 0 && outFrames > 0 && sourceInfo.duration > 0) {
    const expected = options.fps > 0 ? Math.round(sourceInfo.duration * options.fps) : srcFrames;
    const tolerance = Math.max(2, Math.round(expected * 0.01));
    if (Math.abs(outFrames - expected) > tolerance) {
      bad({ reason: 'frame count', source: srcFrames, output: outFrames, expected });
    }
  }

  // 画面比例校验：等比缩放后显示比例不应变化（杜绝拉伸变形）。
  const aspect = (w, h, sar) => (Number(w) > 0 && Number(h) > 0) ? (w / h) * (parseRate(sar) || 1) : 0;
  const srcDar = aspect(sourceInfo.video.width, sourceInfo.video.height, sourceInfo.video.sample_aspect_ratio);
  const outDar = aspect(video.width, video.height, video.sample_aspect_ratio);
  if (srcDar > 0 && outDar > 0 && Math.abs(outDar / srcDar - 1) > 0.02) {
    bad({ reason: 'aspect ratio', source: srcDar, output: outDar });
  }
  return { video, audio, duration };
}

async function transcode() {
  if (!originalFile || !sourceInfo || running) return;
  running = true;
  cancelRequested = false;
  const token = ++operationToken;
  $('btnCompress').disabled = true;
  $('btnCancel').disabled = false;
  $('btnCancel').classList.add('show');
  $('resultBox').classList.remove('show');
  clearOutput();
  hideNotice();
  logs = [];

  const options = {
    ratio: Number($('ratioGroup').querySelector('.seg.selected').dataset.ratio),
    scale: Number($('scaleRange').value),
    format: $('formatSelect').value,
    fps: Number($('fpsSelect').value)
  };
  const ext = options.format;
  const outPath = `/output_${Date.now()}.${ext}`;

  try {
    await mountSource();
    setProgress(11, '正在压缩…');
    phase = 'transcoding';
    let code = await ffmpeg.exec(buildArgs(outPath, options, false));
    if (code !== 0 && !cancelRequested) {
      await removeVirtualFile(outPath);
      logs.push('首次转码失败，启用兼容重试');
      setProgress(13, '遇到特殊格式，正在自动调整参数重试…');
      code = await ffmpeg.exec(buildArgs(outPath, options, true));
    }
    if (cancelRequested || token !== operationToken) throw new Error('操作已停止');
    if (code !== 0) throw new Error(`压缩失败（错误码 ${code}），请重试。`);

    await validateOutput(outPath, options);
    if (cancelRequested || token !== operationToken) throw new Error('操作已停止');
    setProgress(97, '正在生成下载文件…');
    const data = await ffmpeg.readFile(outPath);
    if (cancelRequested || token !== operationToken) throw new Error('操作已停止');
    if (!(data instanceof Uint8Array) || data.byteLength < 1024) throw new Error('输出文件为空或不完整');
    await removeVirtualFile(outPath);
    if (cancelRequested || token !== operationToken) throw new Error('操作已停止');
    outputBlob = new Blob([data.buffer], { type: options.format === 'mov' ? 'video/quicktime' : 'video/mp4' });
    const base = originalFile.name.replace(/\.[^.]+$/, '') || 'video';
    outputName = `${base}_压缩.${ext}`;

    $('verifiedText').textContent = `✓ 压缩完成 · ${ext.toUpperCase()}`;
    showResult();
    setProgress(100, '✅ 压缩完成', 'success');
    // 成功后保留引擎供下次直接使用，加快第二次压缩。
    logs = [];
    phase = 'idle';
  } catch (error) {
    await removeVirtualFile(outPath);
    if (cancelRequested || token !== operationToken) {
      setProgress(0, '已停止处理。');
    } else {
      const message = safeMessage(error);
      setProgress(0, `❌ ${message}`, 'error');
      showNotice(message, true);
    }
    resetEngine();
  } finally {
    running = false;
    phase = 'idle';
    $('btnCancel').disabled = false;
    $('btnCancel').classList.remove('show');
    $('btnCompress').disabled = !sourceInfo;
  }
}

function showResult() {
  const delta = outputBlob.size - originalFile.size;
  const percent = originalFile.size ? Math.round(Math.abs(delta) / originalFile.size * 100) : 0;
  $('resBefore').textContent = fmtBytes(originalFile.size);
  $('resAfter').textContent = fmtBytes(outputBlob.size);
  $('resSaved').textContent = delta <= 0 ? `减少 ${percent}%` : `增加 ${percent}%`;
  $('resSaved').style.color = delta <= 0 ? '#86efac' : '#fbbf24';
  $('resultBox').classList.add('show');
  if (delta > 0) showNotice('压缩后体积比原视频大，可选择「大幅压缩」重新压缩。');
}

function cancel() {
  if (!running) return;
  cancelRequested = true;
  operationToken++;
  $('btnCancel').disabled = true;
  setProgress(0, '正在停止处理…');
  resetEngine();
}

function resetAll() {
  cancelRequested = true;
  operationToken++;
  resetEngine();
  originalFile = null;
  sourceInfo = null;
  clearOutput();
  running = false;
  analyzing = false;
  $('fileInput').value = '';
  resetZone();
  ['controls', 'resultBox'].forEach(id => $(id).classList.remove('show'));
  hideProgress();
  hideNotice();
  $('btnCompress').disabled = true;
  $('btnCancel').classList.remove('show');
  cancelRequested = false;
}

const dropZone = $('dropZone');
dropZone.addEventListener('dragover', event => { event.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', event => {
  event.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = event.dataTransfer?.files?.[0];
  if (file) selectFile(file);
});
$('fileInput').addEventListener('change', event => selectFile(event.target.files?.[0]));
$('btnChange').addEventListener('click', () => $('fileInput').click());
$('ratioGroup').addEventListener('click', event => {
  const btn = event.target.closest('.seg');
  if (!btn) return;
  $('ratioGroup').querySelectorAll('.seg').forEach(b => b.classList.toggle('selected', b === btn));
});
$('scaleRange').addEventListener('input', event => { $('scaleVal').textContent = `${Math.round(Number(event.target.value) * 100)}%`; });
$('btnCompress').addEventListener('click', transcode);
$('btnCancel').addEventListener('click', cancel);
$('btnReset').addEventListener('click', resetAll);
$('btnDownload').addEventListener('click', () => {
  if (!outputBlob) return;
  if (downloadURL) URL.revokeObjectURL(downloadURL);
  downloadURL = URL.createObjectURL(outputBlob);
  const link = document.createElement('a');
  link.href = downloadURL;
  link.download = outputName;
  document.body.appendChild(link);
  link.click();
  link.remove();
});
window.addEventListener('beforeunload', () => {
  resetEngine();
  if (previewURL) URL.revokeObjectURL(previewURL);
  if (downloadURL) URL.revokeObjectURL(downloadURL);
});

if (location.protocol === 'file:') {
  showNotice('请通过「启动视频压缩工具」或网站打开本工具，不要直接双击网页文件。', true);
}
</script>
</body>
</html>
